<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1280" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <linearGradient id="emeraldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="goldButton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.45" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1280" fill="url(#bgGrad)" rx="24" />
  <rect x="15" y="15" width="970" height="1250" fill="none" stroke="#1e293b" stroke-width="2" rx="20" />

  <!-- ── TOP HEADER ── -->
  <g transform="translate(500, 55)" text-anchor="middle">
    <rect x="-180" y="-20" width="360" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
    <text y="-2" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="1.5">CAREER INTELLIGENCE ARCHITECTURE</text>
    <text y="38" fill="#ffffff" font-size="28" font-weight="800">CareerFit AI System Flowchart</text>
    <text y="64" fill="#94a3b8" font-size="14">Candidate Journey &amp; End-to-End Recruitment Intelligence Pipeline</text>
  </g>

  <!-- ── 1. ENTRY & AUTHENTICATION ── -->
  <!-- Start Node -->
  <g transform="translate(500, 160)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-150" y="-22" width="300" height="44" rx="22" fill="#2563eb" stroke="#60a5fa" stroke-width="2" />
    <text y="6" fill="#ffffff" font-size="14" font-weight="700">👤 Candidate / Student Entry</text>
  </g>

  <!-- Flow to Auth Decision -->
  <path d="M 500 182 L 500 215" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)" fill="none" />

  <!-- Auth Decision Diamond -->
  <g transform="translate(500, 245)" filter="url(#shadow)">
    <polygon points="0,-28 95,0 0,28 -95,0" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text text-anchor="middle" y="5" fill="#fbbf24" font-size="12" font-weight="700">Authenticated?</text>
  </g>

  <!-- Branch: Not Authenticated -->
  <path d="M 405 245 L 260 245" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <g transform="translate(190, 245)" text-anchor="middle">
    <rect x="-65" y="-20" width="130" height="40" rx="10" fill="#334155" stroke="#64748b" stroke-width="1" />
    <text y="-2" fill="#f1f5f9" font-size="11" font-weight="700">Sign Up / Login</text>
    <text y="14" fill="#94a3b8" font-size="10">Neon auth.users</text>
  </g>
  <path d="M 190 265 L 190 320 L 400 320" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4" marker-end="url(#arrow)" fill="none" />

  <!-- Branch: Authenticated -->
  <path d="M 500 273 L 500 305" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)" fill="none" />
  <text x="515" y="292" fill="#34d399" font-size="11" font-weight="700">Yes</text>

  <!-- Central Dashboard -->
  <g transform="translate(500, 335)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-180" y="-24" width="360" height="48" rx="14" fill="#0f766e" stroke="#2dd4bf" stroke-width="2" />
    <text y="0" fill="#ffffff" font-size="15" font-weight="800">Student Dashboard &amp; Sidebar Navigation</text>
    <text y="16" fill="#ccfbf1" font-size="11">Active Resume UUID Session &amp; Real-Time Diagnostics</text>
  </g>

  <!-- Distribution Lines to 4 Pillars -->
  <path d="M 500 359 L 500 395" stroke="#60a5fa" stroke-width="2" fill="none" />
  <path d="M 160 395 L 840 395" stroke="#60a5fa" stroke-width="2" fill="none" />
  <path d="M 160 395 L 160 425" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 390 395 L 390 425" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 610 395 L 610 425" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <path d="M 840 395 L 840 425" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <!-- ── 4 COLUMNS / FEATURE TRACKS ── -->

  <!-- TRACK 1: RESUME & ATS OPTIMIZER (X = 160) -->
  <g transform="translate(160, 470)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-105" y="-40" width="210" height="80" rx="14" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="1.8" />
    <text y="-18" fill="#93c5fd" font-size="12" font-weight="700">TRACK 1: RESUME</text>
    <text y="2" fill="#ffffff" font-size="13" font-weight="800">Upload &amp; Parser</text>
    <text y="20" fill="#cbd5e1" font-size="10">pdfminer.six / python-docx</text>
  </g>

  <path d="M 160 510 L 160 550" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <g transform="translate(160, 595)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-105" y="-40" width="210" height="80" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text y="-18" fill="#60a5fa" font-size="12" font-weight="700">ATS Scoring Engine</text>
    <text y="0" fill="#ffffff" font-size="12" font-weight="700">Content / Format / Skills</text>
    <text y="18" fill="#94a3b8" font-size="10">Keyword Gap Analysis</text>
  </g>

  <path d="M 160 635 L 160 675" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <g transform="translate(160, 720)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-105" y="-40" width="210" height="80" rx="14" fill="url(#blueCard)" stroke="#60a5fa" stroke-width="1.5" />
    <text y="-18" fill="#93c5fd" font-size="12" font-weight="700">1-Click AI Rewrite</text>
    <text y="0" fill="#ffffff" font-size="12" font-weight="700">LaTeX / ATS Format</text>
    <text y="18" fill="#38bdf8" font-size="10">Export Pixel-Perfect PDF</text>
  </g>


  <!-- TRACK 2: AI MOCK INTERVIEW (X = 390) -->
  <g transform="translate(390, 470)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-105" y="-40" width="210" height="80" rx="14" fill="url(#purpleCard)" stroke="#a855f7" stroke-width="1.8" />
    <text y="-18" fill="#d8b4fe" font-size="12" font-weight="700">TRACK 2: INTERVIEW</text>
    <text y="2" fill="#ffffff" font-size="13" font-weight="800">AI Mock Interviewer</text>
    <text y="20" fill="#e9d5ff" font-size="10">Contextual Gemini Questions</text>
  </g>

  <path d="M 390 510 L 390 550" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <g transform="translate(390, 595)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-105" y="-40" width="210" height="80" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text y="-18" fill="#c084fc" font-size="12" font-weight="700">Mobile AV Pipeline</text>
    <text y="0" fill="#ffffff" font-size="12" font-weight="700">Front Camera PIP + TTS</text>
    <text y="18" fill="#94a3b8" font-size="10">Voice Dictation (Speech API)</text>
  </g>

  <path d="M 390 635 L 390 675" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <g transform="translate(390, 720)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-105" y="-40" width="210" height="80" rx="14" fill="url(#purpleCard)" stroke="#c084fc" stroke-width="1.5" />
    <text y="-18" fill="#e9d5ff" font-size="12" font-weight="700">Behavioral Scorecard</text>
    <text y="0" fill="#ffffff" font-size="12" font-weight="700">Confidence &amp; Tone</text>
    <text y="18" fill="#f0abfc" font-size="10">Composure &amp; Feedback</text>
  </g>


  <!-- TRACK 3: PLACEMENT ENGINE (X = 610) -->
  <g transform="translate(610, 470)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-105" y="-40" width="210" height="80" rx="14" fill="url(#emeraldCard)" stroke="#10b981" stroke-width="1.8" />
    <text y="-18" fill="#6ee7b7" font-size="12" font-weight="700">TRACK 3: PLACEMENT</text>
    <text y="2" fill="#ffffff" font-size="13" font-weight="800">Placement Engine</text>
    <text y="20" fill="#a7f3d0" font-size="10">Recruiter Cutoffs Criteria</text>
  </g>

  <path d="M 610 510 L 610 550" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" fill="none" />

  <g transform="translate(610, 595)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-105" y="-40" width="210" height="80" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text y="-18" fill="#34d399" font-size="12" font-weight="700">Cutoff Evaluation</text>
    <text y="0" fill="#ffffff" font-size="12" font-weight="700">CGPA, Backlogs, Branch</text>
    <text y="18" fill="#94a3b8" font-size="10">Mandatory Skills Matrix</text>
  </g>

  <path d="M 610 635 L 610 675" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" fill="none" />

  <g transform="translate(610, 720)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-105" y="-40" width="210" height="80" rx="14" fill="url(#emeraldCard)" stroke="#34d399" stroke-width="1.5" />
    <text y="-18" fill="#6ee7b7" font-size="12" font-weight="700">Tier 1 / 2 / 3 Match</text>
    <text y="0" fill="#ffffff" font-size="12" font-weight="700">Google, Amazon, TCS</text>
    <text y="18" fill="#a7f3d0" font-size="10">Explicit Reason Audit</text>
  </g>


  <!-- TRACK 4: LIVE JOBS & RECRUITERS (X = 840) -->
  <g transform="translate(840, 470)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-105" y="-40" width="210" height="80" rx="14" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="1.8" />
    <text y="-18" fill="#fde68a" font-size="12" font-weight="700">TRACK 4: MARKET</text>
    <text y="2" fill="#ffffff" font-size="13" font-weight="800">Live Jobs &amp; Companies</text>
    <text y="20" fill="#fef3c7" font-size="10">Recruiter Match Algorithm</text>
  </g>

  <path d="M 840 510 L 840 550" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <g transform="translate(840, 595)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-105" y="-40" width="210" height="80" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text y="-18" fill="#fbbf24" font-size="12" font-weight="700">Live Job Board</text>
    <text y="0" fill="#ffffff" font-size="12" font-weight="700">Stripe, Razorpay, AWS</text>
    <text y="18" fill="#94a3b8" font-size="10">Salary &amp; Role Details</text>
  </g>

  <path d="M 840 635 L 840 675" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" fill="none" />

  <g transform="translate(840, 720)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-105" y="-40" width="210" height="80" rx="14" fill="url(#amberCard)" stroke="#fbbf24" stroke-width="1.5" />
    <text y="-18" fill="#fde68a" font-size="12" font-weight="700">Direct Application</text>
    <text y="0" fill="#ffffff" font-size="12" font-weight="700">1-Click LinkedIn Apply</text>
    <text y="18" fill="#fed7aa" font-size="10">Kanban Application Tracker</text>
  </g>

  <!-- ── PERSISTENCE & HYBRID INTELLIGENCE INTEGRATION ── -->
  <!-- Convergence Lines to Backend & DB -->
  <path d="M 160 760 L 160 810 L 400 810" stroke="#3b82f6" stroke-width="2" fill="none" />
  <path d="M 390 760 L 390 810 L 460 810" stroke="#a855f7" stroke-width="2" fill="none" />
  <path d="M 610 760 L 610 810 L 540 810" stroke="#10b981" stroke-width="2" fill="none" />
  <path d="M 840 760 L 840 810 L 600 810" stroke="#f59e0b" stroke-width="2" fill="none" />
  <path d="M 500 810 L 500 840" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)" fill="none" />

  <!-- Engine Card -->
  <g transform="translate(500, 895)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-380" y="-50" width="760" height="100" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text y="-25" fill="#38bdf8" font-size="14" font-weight="800">HYBRID INTELLIGENCE &amp; PERSISTENCE HUB</text>
    <text y="-2" fill="#ffffff" font-size="13" font-weight="600">Scikit-Learn SVM Classifier • TF-IDF Vectorization • Google Gemini 1.5 Flash Copilot</text>
    <text y="22" fill="#34d399" font-size="13" font-weight="700">Neon Serverless PostgreSQL (psycopg2 Connection Pooling &amp; Relational Schema)</text>
  </g>

  <path d="M 500 945 L 500 990" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)" fill="none" />

  <!-- ── 3. FINAL OUTCOME: PLACEMENT READY ── -->
  <g transform="translate(500, 1045)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-300" y="-35" width="600" height="70" rx="20" fill="url(#goldButton)" stroke="#6ee7b7" stroke-width="2.5" />
    <text y="-5" fill="#ffffff" font-size="18" font-weight="900" letter-spacing="0.5">🎯 PLACEMENT-READY CANDIDATE</text>
    <text y="18" fill="#ecfdf5" font-size="13" font-weight="600">Verified ATS Resume • Mock Interview Ready • Tier-1 Cleared • Active Job Applications</text>
  </g>

  <!-- Key Metrics Badges at Bottom -->
  <g transform="translate(180, 1160)" text-anchor="middle">
    <rect x="-110" y="-22" width="220" height="44" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text y="-3" fill="#60a5fa" font-size="14" font-weight="800">100% Accuracy</text>
    <text y="14" fill="#94a3b8" font-size="10">SVM Career Domain Model</text>
  </g>

  <g transform="translate(500, 1160)" text-anchor="middle">
    <rect x="-110" y="-22" width="220" height="44" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text y="-3" fill="#34d399" font-size="14" font-weight="800">0ms Cold Starts</text>
    <text y="14" fill="#94a3b8" font-size="10">Neon Serverless Pooling</text>
  </g>

  <g transform="translate(820, 1160)" text-anchor="middle">
    <rect x="-110" y="-22" width="220" height="44" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text y="-3" fill="#f43f5e" font-size="14" font-weight="800">Mobile Responsive</text>
    <text y="14" fill="#94a3b8" font-size="10">Camera PIP &amp; Audio Unlocked</text>
  </g>

  <!-- Footer Tag -->
  <text x="500" y="1235" text-anchor="middle" fill="#64748b" font-size="11">CareerFit AI • Open-Source Production Architecture • Designed for Senior Capstone Engineering</text>
</svg>
